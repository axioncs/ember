name: release

# Builds and attaches the artifact the installer downloads. The container is the
# point: debian:bookworm carries glibc 2.36, so the library loads on Arch and
# Fedora alike. Building on a rolling image would raise that floor to whatever
# the image shipped that week.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git g++ make pkg-config ca-certificates \
            zlib1g-dev libssl-dev libcurl4-openssl-dev

      - uses: actions/checkout@v4

      # The core lives in its own repo. A tag carries the release's purpose in
      # its name, so the two tags move together: v0.8.0-test in ember is built
      # against v0.8.0-test in ember-core. Fall back to the branch when that
      # tag does not exist, and fail loudly rather than shipping another tag's
      # library.
      - name: resolve the core ref
        id: core
        run: |
          set -eu
          ref="${GITHUB_REF_NAME}"
          if git ls-remote --tags --exit-code \
               https://github.com/axioncs/ember-core "refs/tags/${ref}" >/dev/null 2>&1; then
            echo "core_ref=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ember-core has no tag ${ref}; building the ember branch"
            echo "core_ref=ember" >> "$GITHUB_OUTPUT"
          fi

      - name: build and package
        env:
          EMBER_CORE_REF: ${{ steps.core.outputs.core_ref }}
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: verify the pinned sha256 matches
        run: |
          set -eu
          artifact="dist/ember-${GITHUB_REF_NAME}-x86_64-linux.tar.gz"
          if [ -f "$artifact.sha256" ]; then
            actual="$(cut -d' ' -f1 "$artifact.sha256")"
          else
            actual="$(sha256sum "$artifact" | cut -d' ' -f1)"
          fi
          pinned="$(sed -n 's/.*sha256 = "\([a-f0-9]\{64\}\)".*/\1/p' flake.nix | head -1)"
          echo "actual: $actual"
          echo "pinned: $pinned"
          if [ -n "$pinned" ] && [ "$actual" != "$pinned" ]; then
            echo "::error::the artifact hash changed; update flake.nix and re-tag"
            exit 1
          fi

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
