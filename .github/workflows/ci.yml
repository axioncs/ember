name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4 const check
        run: python3 tools/lint-lua.py packages/cli/ember.lua
      - name: Shell syntax
        run: |
          sh -n scripts/install.sh
          sh -n scripts/build-release.sh
      - name: UI parser tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          EMBER_CLI_LIBRARY_ONLY=1 lua5.4 tools/test_ui.lua packages/cli/ember.lua
