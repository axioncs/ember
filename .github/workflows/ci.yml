name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4 const check
        run: python3 tools/lint-lua.py packages/cli/ember.lua
      - name: Shell syntax
        run: |
          sh -n scripts/install.sh
          sh -n scripts/build-release.sh

      # The installer's launch model: steam/Steam untouched, steam-ember plus a
      # Wired Steam entry, legacy shim restored on upgrade, clean uninstall.
      - name: installer functional test
        run: |
          git clone --depth 1 --branch "${EMBER_CORE_REF:-ember}" \
            https://github.com/axioncs/ember-core ember-core
          EMBER_CORE_SRC="$PWD/ember-core" sh scripts/test-install.sh

      # The unit library renders the badge watcher and cloud-push timer. It
      # lives in ember-core and is what the distro installer sources, so the
      # test runs from the core checkout rather than this repo.
      - name: user unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends systemd
          git clone --depth 1 --branch "${EMBER_CORE_REF:-ember}" \
            https://github.com/axioncs/ember-core ember-core
          bash ember-core/scripts/test-ember-units.sh

      - name: UI parser tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          EMBER_CLI_LIBRARY_ONLY=1 lua5.4 tools/test_ui.lua packages/cli/ember.lua

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git g++ make pkg-config ca-certificates \
            zlib1g-dev libssl-dev libcurl4-openssl-dev

      - name: fetch ember-core
        run: |
          git clone --depth 1 --branch "${EMBER_CORE_REF:-ember}" \
            https://github.com/axioncs/ember-core ember-core

      - name: build the core
        working-directory: ember-core
        run: make -j"$(nproc)" bin/ember-core.so bin/ember-library-inject.so

      - name: install and package
        run: sh scripts/build-release.sh ci-test

      - name: verify the archive
        run: |
          test -f dist/ember-ci-test-x86_64-linux.tar.gz
          tar tzf dist/ember-ci-test-x86_64-linux.tar.gz | sort
