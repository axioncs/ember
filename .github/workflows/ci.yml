name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4 const check
        run: python3 tools/lint-lua.py packages/cli/ember.lua
      - name: Shell syntax
        run: sh -n scripts/install.sh
